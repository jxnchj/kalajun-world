<!doctype html><meta charset="utf-8"><title>整景草根风场同相位对照</title><style>body{background:#172019;color:white;font:13px system-ui}iframe{width:1280px;height:800px;border:0}input{width:850px}pre{white-space:pre-wrap}</style><h2>整景草根风场 · 原/候选/候选/原同相位像素</h2><input id="url" value="/dist-v2/v2.html?view=river-forest&profile=1&debug=1&time=870"><button id="load">加载指定构建</button><button id="status">读取状态</button><select id="visibility"><option value="0">原整块提交</option><option value="1">视锥并集紧排</option></select><button id="gpu">含cache更新GPU ABBA</button><button id="run">冻结后执行像素ABBA</button><pre id="info">独立验收壳，仅使用内页debug现成对象；不导入另一套Three。</pre><iframe id="world"></iframe><script type="module">
const frame=document.querySelector('#world'),info=document.querySelector('#info');let loadedURL='';
const api=()=>{const a=frame.contentWindow?.kalajunV2;if(!a?.debug?.meadowRootWind)throw Error('构建尚未就绪或未含草风候选');const d=a.debug;if(d.renderer.getPixelRatio()!==1||d.renderer.domElement.width!==1280||d.renderer.domElement.height!==800){d.renderer.setPixelRatio(1);d.renderer.setSize(1280,800,false);d.worldFrame?.setSize(1280,800);d.camera.aspect=1.6;d.camera.updateProjectionMatrix();d.environment.csm.updateFrustums();}return a;};
document.querySelector('#load').onclick=()=>{loadedURL=document.querySelector('#url').value;frame.src=loadedURL;info.textContent='加载中；待q/m等队列稳定后读取状态';};
document.querySelector('#status').onclick=()=>{try{const s=api().getSnapshot();info.textContent=JSON.stringify({ready:s.ready,preparing:s.preparing,terrain:s.terrain.queuedTiles,ecology:s.ecology.pending,viewport:s.viewport,wind:s.ecology.meadowRootWind41,errors:s.errors},null,2);}catch(e){info.textContent=e.message;}};
function compare(a,b){let changed=0,over2=0,max=0,total=0,sourceLit=0;for(let i=0;i<a.length;i+=4){let d=0;if(a[i]||a[i+1]||a[i+2])sourceLit++;for(let c=0;c<4;c++){const v=Math.abs(a[i+c]-b[i+c]);d=Math.max(d,v);total+=v;}if(d)changed++;if(d>2)over2++;max=Math.max(max,d);}return{changedPixels:changed,over2,maxChannel:max,totalDifference:total,sourceLit};}
document.querySelector('#run').onclick=async()=>{try{const a=api(),d=a.debug,s=a.getSnapshot();if(!s.ready||s.preparing||s.errors.length||s.terrain.queuedTiles||s.ecology.pending)throw Error('真实场景未稳定，拒绝把加载期差异当像素对照');d.setReviewHold(true);d.meadowViews.setEnabled(document.querySelector('#visibility').value==='1');const enabled=d.meadowRootWind.enabled,gl=d.renderer.getContext(),w=d.renderer.domElement.width,h=d.renderer.domElement.height,rows=[],pixels=[];info.textContent='已冻结世界和相机；运行ABBA';try{for(const [label,on]of[['a1',false],['b1',true],['b2',true],['a2',false]]){d.meadowRootWind.setEnabled(on);for(let j=0;j<4;j++)d.renderFrozenWorld();const bytes=new Uint8Array(w*h*4);gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,bytes);const error=gl.getError();if(error)throw Error('GL readback error '+error);pixels.push(bytes);rows.push({label,on,wind:{...d.meadowRootWind.stats},snapshot:a.getSnapshot()});const response=await fetch('/__review38/evidence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'meadow-root-wind41-vis'+document.querySelector('#visibility').value+'-'+label,snapshot:rows.at(-1),png:d.renderer.domElement.toDataURL()})});if(!response.ok)throw Error(await response.text());}}finally{d.meadowRootWind.setEnabled(enabled);}const result={loadedURL,width:w,height:h,rows,differenceAB:compare(pixels[0],pixels[1]),repeatAA:compare(pixels[0],pixels[3]),repeatBB:compare(pixels[1],pixels[2]),scope:'Same-scene frozen ABBA, complete colour pipeline incl shadows/reflection; GPU performance measured separately.'};const response=await fetch('/__review38/evidence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'meadow-root-wind41-vis'+document.querySelector('#visibility').value+'-summary',snapshot:result})});if(!response.ok)throw Error(await response.text());info.textContent=JSON.stringify(result,null,2)+'\n全部文件服务器确认保存；内页保持冻结';}catch(e){info.textContent='失败：'+e.stack;}};
document.querySelector('#gpu').onclick=async()=>{try{const a=api(),d=a.debug,s=a.getSnapshot();if(!s.ready||s.preparing||s.errors.length||s.terrain.queuedTiles||s.ecology.pending)throw Error('场景未稳定');d.setReviewHold(true);const vis=document.querySelector('#visibility').value;d.meadowViews.setEnabled(vis==='1');const gl=d.renderer.getContext(),ext=gl.getExtension('EXT_disjoint_timer_query_webgl2');if(!ext)throw Error('GPU timer unavailable');const pause=()=>new Promise(r=>requestAnimationFrame(r));const measure=async(fn)=>{if(gl.getQuery(ext.TIME_ELAPSED_EXT,gl.CURRENT_QUERY))throw Error('Other GPU query active');const q=gl.createQuery();gl.beginQuery(ext.TIME_ELAPSED_EXT,q);fn();gl.endQuery(ext.TIME_ELAPSED_EXT);for(let n=0;n<300&&!gl.getQueryParameter(q,gl.QUERY_RESULT_AVAILABLE);n++)await pause();if(!gl.getQueryParameter(q,gl.QUERY_RESULT_AVAILABLE))throw Error('GPU query timeout');const ms=gl.getQueryParameter(q,gl.QUERY_RESULT)/1e6,disjoint=gl.getParameter(ext.GPU_DISJOINT_EXT);gl.deleteQuery(q);if(disjoint)throw Error('GPU disjoint');return ms;};const enabled=d.meadowRootWind.enabled,rows=[];try{for(const[label,on]of[['a1',false],['b1',true],['b2',true],['a2',false]]){info.textContent='GPU '+label+'：冻结相位，每次强制更新cache，含更新成本';d.meadowRootWind.setEnabled(on);for(let i=0;i<6;i++){if(on)d.meadowRootWind.signature=null;d.renderFrozenWorld();await pause();}const samples=[];for(let i=0;i<32;i++)samples.push(await measure(()=>{if(on)d.meadowRootWind.signature=null;d.renderFrozenWorld();}));rows.push({label,on,samples,meanMs:samples.reduce((a,b)=>a+b)/samples.length,wind:{...d.meadowRootWind.stats},position:d.camera.position.toArray(),time:d.ecology.uniforms.uWindTime.value});}d.meadowRootWind.setEnabled(true);d.renderFrozenWorld();const cacheSamples=[];for(let i=0;i<16;i++)cacheSamples.push(await measure(()=>d.meadowRootWind.cache.update(d.renderer)));rows.push({label:'cache-only',samples:cacheSamples,meanMs:cacheSamples.reduce((a,b)=>a+b)/cacheSamples.length,wind:{...d.meadowRootWind.stats}});}finally{d.meadowRootWind.setEnabled(enabled);}const result={loadedURL,visibility:vis,viewport:a.getSnapshot().viewport,rows,scope:'Actual EXT GPU ABBA. Frozen same phase/camera; every candidate frame forcibly includes original per-root cache update. Cache-only sampled separately. No density change.'};const saved=await fetch('/__review38/evidence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'meadow-root-wind41-vis'+vis+'-gpu',snapshot:result})});if(!saved.ok)throw Error(await saved.text());info.textContent=JSON.stringify(result,null,2)+'\nGPU数据已保存';}catch(e){info.textContent='失败：'+e.stack;}};

const dynamicButton=document.createElement('button');dynamicButton.id='dynamic';dynamicButton.textContent='原动态frame 14秒ABBA';document.querySelector('#run').after(dynamicButton);
dynamicButton.onclick=async()=>{try{const a=api(),d=a.debug,s=a.getSnapshot();if(!s.ready||s.preparing||s.errors.length||s.terrain.queuedTiles||s.ecology.pending||s.time!==870)throw Error('需要time870且q0/m0/无错误');const vis=document.querySelector('#visibility').value;d.setReviewHold(true);d.meadowViews.setEnabled(vis==='1');const gl=d.renderer.getContext(),ext=gl.getExtension('EXT_disjoint_timer_query_webgl2');if(!ext||!s.gpu.available)throw Error('需要原整帧GPU计时');const originalBegin=gl.beginQuery,originalGet=gl.getQueryParameter,originalUpdate=d.controls.update;const starts=new WeakMap(),gpu=[],intervals=[],rows=[],enabled=d.meadowRootWind.enabled;let segment=null;gl.beginQuery=function(target,q){if(target===ext.TIME_ELAPSED_EXT)starts.set(q,performance.now());return originalBegin.apply(this,arguments);};gl.getQueryParameter=function(q,param){const result=originalGet.apply(this,arguments);if(param===gl.QUERY_RESULT&&segment){const at=starts.get(q);if(at>=segment.sampleStart&&at<segment.end&&!gl.getParameter(ext.GPU_DISJOINT_EXT))gpu.push({at,ms:result/1e6});}return result;};d.controls.update=function(dt){const now=performance.now();if(segment&&now>=segment.sampleStart&&now<segment.end)intervals.push(dt*1000);return originalUpdate.apply(this,arguments);};const pause=ms=>new Promise(r=>setTimeout(r,ms));try{for(const[label,on]of[['a1',false],['b1',true],['b2',true],['a2',false]]){d.setReviewHold(true);d.meadowRootWind.setEnabled(on);gpu.length=0;intervals.length=0;const begin=performance.now();segment={sampleStart:begin+2000,end:begin+14000};const before=structuredClone(a.getSnapshot());info.textContent='动态 '+label+'：14秒，前2秒剔除，原frame/风/阴影正常更新';d.setReviewHold(false);await pause(14000);d.setReviewHold(true);const after=structuredClone(a.getSnapshot()),sorted=[...intervals].sort((x,y)=>x-y);rows.push({label,on,gpuSamples:[...gpu],gpuMeanMs:gpu.reduce((n,r)=>n+r.ms,0)/Math.max(1,gpu.length),frameSamples:[...intervals],frameMeanMs:intervals.reduce((n,x)=>n+x,0)/Math.max(1,intervals.length),frameP50:sorted[Math.floor(sorted.length*.5)],frameP95:sorted[Math.floor(sorted.length*.95)],before,after});segment=null;if(after.errors.length||after.terrain.queuedTiles||after.ecology.pending)throw Error('动态队列/错误失稳');}}finally{d.setReviewHold(true);gl.beginQuery=originalBegin;gl.getQueryParameter=originalGet;d.controls.update=originalUpdate;d.meadowRootWind.setEnabled(enabled);}const result={loadedURL,visibility:vis,viewport:a.getSnapshot().viewport,rows,scope:'Original dynamic frame, 14s each / first2s excluded, original native render-world-and-reflection query results and real controls.update dt; no alternate render/update path.'};const saved=await fetch('/__review38/evidence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'meadow-root-wind41-vis'+vis+'-dynamic',snapshot:result})});if(!saved.ok)throw Error(await saved.text());info.textContent=JSON.stringify(result,null,2)+'\n动态数据已保存';}catch(e){info.textContent='失败：'+e.stack;}};
</script>

<!doctype html><html lang="zh"><meta charset="utf-8"><title>真实世界草冠接替42</title><style>body{margin:8px;font:14px system-ui;background:#21342d;color:white}iframe{width:1280px;height:800px;border:0}pre{white-space:pre-wrap}button{margin:4px}</style><button id="run">运行实际世界完整验收</button><pre id="status">等待主世界；先加载完成再运行。主默认不变。</pre><iframe id="world" src="/dist-v2/v2.html?view=meadow&time=870&profile=1&meadowCluster42=1&meadowClusterPool42=1&meadowClusterWind42=1"></iframe><script type="module">

const frame=document.querySelector('#world'),status=document.querySelector('#status');let owner;
const raf=()=>new Promise(r=>requestAnimationFrame(r)),delay=ms=>new Promise(r=>setTimeout(r,ms));
const save=async(name,png,snapshot)=>{const r=await fetch('/__review38/evidence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,png,snapshot})});if(!r.ok)throw Error('Evidence '+r.status);};
const median=a=>[...a].sort((a,b)=>a-b)[Math.floor(a.length/2)];
document.querySelector('#run').onclick=async()=>{const start=performance.now();let app,d;try{document.querySelector('#run').disabled=true;app=frame.contentWindow.kalajunV2;if(!app?.debug)throw Error('主世界尚未ready');d=app.debug;status.textContent='等待原主世界完整队列…';
 async function settle(){d.setReviewHold(false);let stable=0;const deadline=performance.now()+180000;while(performance.now()<deadline){await delay(100);const s=app.getSnapshot();if(s.errors.length)throw Error(JSON.stringify(s.errors));if(s.terrain.queuedTiles===0&&d.terrain.morphs.size===0&&d.meadowCluster.stats.pending===0)stable++;else stable=0;if(stable>=5){d.setReviewHold(true);return;}}throw Error('World queues did not settle');}
 await settle();status.textContent='核对458根来源并制作连续方向体积…';if(!frame.contentWindow.installMeadowVolumeWorld42){const bridge=frame.contentDocument.createElement('script');bridge.type='module';bridge.src='/dist-v2/meadow-volume-world42/bridge42.js';frame.contentDocument.head.append(bridge);for(let i=0;i<100&&!frame.contentWindow.installMeadowVolumeWorld42;i++)await delay(50);}if(!frame.contentWindow.installMeadowVolumeWorld42)throw Error('Child realm bridge unavailable');owner=await frame.contentWindow.installMeadowVolumeWorld42(app);window.volumeWorld42=owner;status.textContent='已安装，逐机位原图/接替/恢复…';const canvas=d.renderer.domElement;
 function pose(distance,elevation,azimuth){const p=owner.cameraPose(distance,elevation,azimuth);d.controls.setPose(p.position[0],p.position[2],0,(360-azimuth)%360,-elevation,p.position[1]);return p;}
 function image(){d.renderFrozenWorld();return canvas.toDataURL('image/png');}
 async function pair(distance,elevation,azimuth){const p=pose(distance,elevation,azimuth);await settle();for(const [label,on]of[['original',false],['candidate',true],['restored',false]]){owner.setEnabled(on);await save(`volume-world42-${distance}-${elevation}-${azimuth}-${label}`,image(),{pose:p,stats:structuredClone(owner.stats),snapshot:app.getSnapshot()});}}
 for(const p of[[280,10,0],[296,10,0],[308,10,0],[320,10,0],[350,10,0],[400,10,0],[350,42,0],[350,10,44],[350,10,45],[350,10,46],[350,2,0]]){status.textContent='实际机位 '+p.join('/');await pair(...p);}
 status.textContent='280→400真实相机平移…';pose(280,10,0);await settle();owner.setEnabled(true);d.setReviewHold(false);const movement=[];for(let i=0;i<=120;i++){pose(280+i,10,0);await raf();if(i%12===0){d.setReviewHold(true);await save(`volume-world42-move-${280+i}`,image(),{snapshot:app.getSnapshot(),stats:structuredClone(owner.stats)});movement.push(app.getSnapshot().position);d.setReviewHold(false);}}await settle();
 status.textContent='定点冻结GPU ABBA（包含真实depth捕获）…';pose(350,10,0);await settle();const gl=d.renderer.getContext(),ext=gl.getExtension('EXT_disjoint_timer_query_webgl2'),blocks=[];
 if(ext){for(const enabled of[false,true,true,false]){owner.setEnabled(enabled);for(let i=0;i<10;i++){d.renderFrozenWorld();await raf();}const gpu=[],cpu=[];for(let i=0;i<20;i++){if(gl.getQuery(ext.TIME_ELAPSED_EXT,gl.CURRENT_QUERY))throw Error('GPU query conflict');const q=gl.createQuery(),t=performance.now();gl.beginQuery(ext.TIME_ELAPSED_EXT,q);try{d.renderFrozenWorld();}finally{gl.endQuery(ext.TIME_ELAPSED_EXT);}cpu.push(performance.now()-t);let attempts=0;while(!gl.getQueryParameter(q,gl.QUERY_RESULT_AVAILABLE)){await raf();if(++attempts>600)throw Error('GPU timer timeout');}if(gl.getParameter(ext.GPU_DISJOINT_EXT))throw Error('GPU disjoint');gpu.push(gl.getQueryParameter(q,gl.QUERY_RESULT)/1e6);gl.deleteQuery(q);}blocks.push({enabled,gpuMedian:median(gpu),cpuMedian:median(cpu),gpu,cpu});}}
 owner.setEnabled(true);d.renderFrozenWorld();const texturesActive=d.renderer.info.memory.textures,stats=structuredClone(owner.stats);owner.dispose();d.renderFrozenWorld();const texturesAfter=d.renderer.info.memory.textures;const summary={elapsedMs:performance.now()-start,blocks,texturesActive,texturesAfter,expectedVolumeTextures:6,movement,stats,snapshot:app.getSnapshot(),scope:'Real world same-phase frozen GPU ABBA; not normal frame FPS; original cluster unchanged'};await save('volume-world42-summary',image(),summary);status.textContent='完成 '+JSON.stringify(summary,null,2);
 }catch(e){status.textContent='失败 '+e.stack;console.error(e);}finally{owner?.dispose();d?.setReviewHold(true);document.querySelector('#run').disabled=false;}};
</script></html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>动物动作预览</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1f1c; color: #f4f1e6; font: 13px -apple-system, "PingFang SC", sans-serif; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #ui { position: fixed; top: 10px; left: 10px; max-width: 340px; background: rgba(18, 22, 20, 0.66); padding: 10px 12px; border-radius: 10px; line-height: 1.5; }
      #ui h1 { font-size: 14px; margin: 0 0 6px; font-weight: 600; }
      #ui .row { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; align-items: center; }
      #ui button { background: rgba(255, 255, 255, 0.1); color: inherit; border: 1px solid rgba(255, 255, 255, 0.22); border-radius: 6px; padding: 3px 8px; font: inherit; cursor: pointer; }
      #ui button.on { background: #e8d9a8; color: #1b1f1c; border-color: #e8d9a8; }
      #ui .note { opacity: 0.75; font-size: 12px; }
      #ui label { white-space: nowrap; }
      #ui select { font: inherit; background: rgba(255, 255, 255, 0.1); color: inherit; border: 1px solid rgba(255, 255, 255, 0.22); border-radius: 6px; }
      #ui option { color: #1b1f1c; }
      #status { position: fixed; bottom: 10px; left: 10px; background: rgba(18, 22, 20, 0.6); padding: 4px 9px; border-radius: 7px; font-size: 12px; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="ui">
      <h1><select id="species"><option value="sheep">羊</option><option value="lamb">羊羔</option><option value="cattle">牛</option><option value="horse">马</option><option value="foal">小马驹</option><option value="dog">狗</option><option value="marmot">旱獭</option><option value="eagle">金雕</option></select> · 动作预览</h1>
      <div class="row" id="clips"></div>
      <div class="row">
        <button id="seq">连续：卧下 → 卧着 → 起身</button>
      </div>
      <div class="row">
        <label><input type="checkbox" id="tread" checked /> 走路时地面后移（看脚是否打滑）</label>
      </div>
      <div class="row">
        <label>速度 <input id="rate" type="range" min="0.1" max="1" step="0.05" value="1" /> <span id="rate-v">1×</span></label>
      </div>
      <div class="row">
        <span>精度</span>
        <button data-lod="0" class="on">近</button><button data-lod="1">中</button><button data-lod="2">远</button>
      </div>
      <div class="row">
        <button id="flock">一群（80只，随机动作）</button>
        <label>时间 <input id="time" type="range" min="360" max="1380" value="1000" /></label>
      </div>
      <div class="note" id="legend"></div>
      <div class="note">左键拖动旋转，右键平移，滚轮缩放</div>
    </div>
    <div id="status">加载中…</div>
    <script type="module" src="./src/animalview.js"></script>
  </body>
</html>
